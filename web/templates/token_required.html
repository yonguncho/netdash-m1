<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>NetDash — 접속 토큰 필요</title>
  <style>
    body { margin:0; font-family:"Malgun Gothic",sans-serif; background:#0f172a; color:#e2e8f0;
           display:flex; align-items:center; justify-content:center; height:100vh; }
    .box { background:#1e293b; border:1px solid #334155; border-radius:10px; padding:28px 32px;
           width:400px; box-shadow:0 10px 30px rgba(0,0,0,.4); }
    h1 { font-size:18px; margin:0 0 6px; }
    p { font-size:13px; color:#94a3b8; line-height:1.6; margin:0 0 16px; }
    code { color:#cbd5e1; }
    input { width:100%; box-sizing:border-box; padding:9px 11px; border-radius:6px;
            border:1px solid #475569; background:#0f172a; color:#e2e8f0; font-size:13px; }
    button { margin-top:10px; width:100%; padding:9px; border:0; border-radius:6px;
             background:#2563eb; color:#fff; font-size:13px; cursor:pointer; }
    button:hover { background:#1d4ed8; }
    .err { color:#fca5a5; font-size:13px; margin:0 0 10px; }
  </style>
</head>
<body>
  <div class="box">
    <h1>🔒 접속 토큰이 필요합니다</h1>
    {% if error %}<p class="err">{{ error }}</p>{% endif %}
    <p>원격 접속에는 <code>config.yaml</code> 의 <b>api_token</b> 값이 필요합니다.
       관리자에게 문의하세요.</p>
    <!-- POST로 제출한다. 쿼리스트링(?token=)으로 보내면 접근 로그와 브라우저
         히스토리에 토큰이 평문으로 남는다. -->
    <form method="post" action="/session" autocomplete="off">
      <input type="hidden" name="next" value="{{ next_path or '/' }}">
      <input type="password" name="token" placeholder="접속 토큰" autocomplete="off" autofocus>
      <button type="submit">접속</button>
    </form>
  </div>
</body>
</html>
