<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NetDash 관제</title>
  <link rel="stylesheet" href="/static/wall.css">
</head>
<body>
  <header class="wall-header">
    <span class="wall-logo">
      <svg class="wall-logo__mark" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="2" y="2" width="9" height="9" rx="2"/><rect x="13" y="2" width="9" height="9" rx="2"/>
        <rect x="2" y="13" width="9" height="9" rx="2"/><path d="M17.5 13v9M13 17.5h9"/>
      </svg>
      NetDash 관제<em class="wall-logo__sub">Network Operations</em>
    </span>
    <span class="wall-header__right">
      <span id="wall-tv-ind" class="wall-live wall-live--tv" style="display:none"
            title="TV 모드 — 30초마다 탭 자동 전환, 알람 발생 시 해당 탭 이동"><i></i>TV 로테이션</span>
      <span class="wall-live"><i></i>LIVE</span>
      <span id="wall-clock" class="wall-clock"></span>
    </span>
  </header>

  <section class="wall-tiles">
    <div class="tile"><div class="tile__num" id="t-total">-</div><div class="tile__label">등록 스위치</div></div>
    <div class="tile tile--bad"><div class="tile__num" id="t-unreach">-</div><div class="tile__label">도달 불가</div></div>
    <div class="tile tile--bad"><div class="tile__num" id="t-failed">-</div><div class="tile__label">수집 실패</div></div>
    <div class="tile tile--warn"><div class="tile__num" id="t-alert">-</div><div class="tile__label">경보(FLAP/LOOP)</div></div>
    <div class="tile tile--bad"><div class="tile__num" id="t-fwdown">-</div><div class="tile__label">방화벽 장애</div></div>
    <div class="tile tile--warn"><div class="tile__num" id="t-facoff">-</div><div class="tile__label">설비 연결 실패</div></div>
    <div class="tile tile--warn"><div class="tile__num" id="t-unack">-</div><div class="tile__label">미확인 알람</div></div>
  </section>

  <!-- 통합 대시보드 탭 — 요약(문제 목록)은 그대로 두고, 장비 종류별 통계를 더한다.
       기존 관제는 '무엇이 고장났나'만 보여줘서 '전체가 어떤 상태인가'를 알 수 없었다. -->
  <nav class="wall-tabs" id="wall-tabs">
    <button class="wall-tab wall-tab--on" data-wtab="summary">요약 · 장애</button>
    <button class="wall-tab" data-wtab="switch">스위치</button>
    <button class="wall-tab" data-wtab="firewall">방화벽</button>
    <button class="wall-tab" data-wtab="facility">설비</button>
  </nav>

  <section id="wtab-summary" class="wall-pane wall-pane--on">
    <!-- 위험도 순위는 장애 목록 '위'에 둔다 — 아직 장애는 아니지만 곧 될 것들.
         장애 목록 자체는 관제의 본래 목적이라 그대로 유지한다. -->
    <div id="wall-risk"></div>
    <div id="wall-problems" class="wall-problems"></div>
  </section>
  <section id="wtab-switch" class="wall-pane"></section>
  <section id="wtab-firewall" class="wall-pane"></section>
  <section id="wtab-facility" class="wall-pane"></section>

  <!-- 스위치 요약 팝업 — Top10 클릭 시 리디렉션 대신 관제 화면 안에서 보여준다 -->
  <div id="wsw-modal" class="wswm" style="display:none">
    <div class="wswm__bg" data-close="1"></div>
    <div class="wswm__box">
      <div class="wswm__hd">
        <div><div class="wswm__nm" id="wsw-name">-</div><div class="wswm__ip" id="wsw-sub">-</div></div>
        <button class="wswm__x" data-close="1">&times;</button>
      </div>
      <div class="wswm__bd" id="wsw-body">불러오는 중...</div>
    </div>
  </div>

  <footer class="wall-ticker">
    <div id="wall-events" class="wall-ticker__inner"></div>
  </footer>

  <script>window._API_TOKEN = {{ (api_token or "")|tojson }};</script>
  <!-- uPlot v1.6.32 (MIT) — 시계열 차트. 폐쇄망 대응으로 exe에 번들(외부 접근 없음) -->
  <link rel="stylesheet" href="/static/vendor/uplot.min.css">
  <script src="/static/vendor/uplot.iife.min.js"></script>
  <script src="/static/wall.js"></script>
</body>
</html>
