# NetDash M2 설정 파일
# 작성일: 2026-06-16

# Security: API authentication token (required in production mode)
# IMPORTANT: Set this via API_TOKEN environment variable, not in this file!
# Keeping secrets in version control is a security risk. Use environment variables in production.
api_token: null  # Will be overridden by API_TOKEN environment variable if set

app:
  debug: false
  host: "127.0.0.1"
  port: 8082
  demo_mode: false  # Set DEMO_MODE=true environment variable to enable demo mode
  # 이름으로 접속할 때만 필요. IP·localhost는 항상 허용된다.
  # (Host 헤더 허용목록 — DNS 리바인딩 방어. 예: ["netdash.corp.local"])
  allowed_hosts: []

collector:
  max_concurrent: 3
  ssh_timeout: 30
  read_timeout: 60
  # ── 전송 보안(기본값은 현행 동작 유지 — 켜면 수집이 막힐 수 있다) ──
  # SSH 호스트키 검증:
  #   auto   장비 키를 그냥 받는다(기본). 기억하지 않아 키가 바뀌어도 모른다.
  #   tofu   처음 본 장비는 받아 적고, 이후 키가 바뀌면 거부한다(권장).
  #          첫 수집을 막지 않으면서 중간자 교체를 잡는다. known_hosts는 DB 옆에 생성.
  #   strict known_hosts에 미리 등록된 장비만 접속(사전 등록 필요).
  ssh_host_key_policy: "auto"
  # 방화벽 HTTPS 인증서 검증. 자체 서명 인증서를 쓰는 장비가 많아 기본은 false.
  # true로 켜려면 그 인증서(사설 CA)를 이 PC의 신뢰 저장소에 먼저 넣어야 한다.
  verify_firewall_tls: false
  # 정적 IP 화이트리스트는 기본 비활성(빈 목록). 등록은 '실제 도달(ping/TCP)'로 허용한다.
  # SSRF 위험 대역(loopback/link-local/multicast/reserved)은 validate_ipv4에서 항상 차단.
  # 특정 대역만 허용하도록 제한하려면 아래에 CIDR을 추가(예: "10.0.0.0/8").
  allowed_ip_ranges: []

  commands:
    cisco_ios:
      status: "show interfaces status"
      description: "show interfaces description"
      mac: "show mac address-table"
      arp: "show ip arp"
      vlan: "show vlan brief"
      logging: "show logging"
      errors: "show interfaces"
      neighbors: "show cdp neighbors detail"
      lldp: "show lldp neighbors detail"
      # 라우터/음성게이트웨이(VG3X0 등)는 'show interfaces status'(스위치 전용)를
      # 지원하지 않아 포트 0대 → 'show ip interface brief'로 폴백 파싱.
      port_brief: "show ip interface brief"
    arista_eos:
      status: "show interfaces"
      description: "show interfaces description"
      mac: "show mac address-table dynamic"
      arp: "show ip arp"
      logging: "show logging last 100"
      errors: "show interfaces"
      lldp: "show lldp neighbors detail"
    extreme_exos:
      status: "show ports no-refresh"
      description: "show ports description"
      mac: "show fdb"
      arp: "show iparp"
      logging: "show log messages memory-buffer"
      sysinfo: "show switch"
      lldp: "show lldp neighbors detailed"
      errors: "show ports rxerrors no-refresh"
      txerrors: "show ports txerrors no-refresh"
    cisco_nxos:
      detail: "show interface"
      status: "show interface status"
      brief: "show interface brief"
      description: "show interface description"
      mac: "show mac address-table dynamic"
      arp: "show ip arp"
      vlan: "show vlan brief"
      logging: "show logging last 100"
      port_channel: "show port-channel summary"
      inventory: "show inventory"
      neighbors: "show cdp neighbors detail"
      lldp: "show lldp neighbors detail"

correlator:
  uplink_mac_threshold: 4

database:
  path: "netdash.db"

raw_outputs:
  path: "raw_outputs"

logging:
  level: "INFO"
  format: "json"
  filters:
    exclude_paramiko: true
